recalibrate:
  name: Recalibrate plant
  description: >-
    Wipe a plant's learned baseline and sample history to restart the 14-day
    calibration. Use after repotting, changing soil, or moving the plant to a
    new location (or between indoor and outdoor).
  fields:
    plant_id:
      name: Plant ID
      description: The configured plant instance to recalibrate.
      required: true
      example: monstera_livingroom
      selector:
        text:

refresh_species:
  name: Refresh species data
  description: >-
    Re-fetch species enrichment (Perenual, Trefle, iNaturalist) for one plant or
    all plants, updating care context and the provider diagnostic sensors.
  fields:
    plant_id:
      name: Plant ID
      description: Optional — a single plant to refresh. Omit to refresh all.
      example: snake_plant
      selector:
        text:
