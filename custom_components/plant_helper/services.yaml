recalibrate:
  name: Recalibrate plant
  description: >-
    Clear the plant's active-placement baseline and local sample history to
    restart its 14-day calibration. The other placement's learned baseline is
    preserved. Use after repotting, changing soil, or substantially changing
    conditions within the current placement.
  fields:
    plant_id:
      name: Plant ID
      description: The configured plant instance to recalibrate.
      required: true
      example: monstera_livingroom
      selector:
        text:

refresh_species:
  name: Refresh species data
  description: >-
    Re-fetch species enrichment (Perenual, Trefle, iNaturalist) for one plant or
    all plants, updating care context and the provider diagnostic sensors.
  fields:
    plant_id:
      name: Plant ID
      description: Optional — a single plant to refresh. Omit to refresh all.
      example: snake_plant
      selector:
        text:
