name: Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Python and JSON files
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 custom_components/plant_helper --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 custom_components/plant_helper --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/plant_helper/manifest.json > /dev/null
          python -m json.tool custom_components/plant_helper/strings.json > /dev/null
          python -m json.tool custom_components/plant_helper/translations/en.json > /dev/null
          python -m json.tool hacs.json > /dev/null
      
      - name: Check for Python syntax errors
        run: |
          python -m py_compile custom_components/plant_helper/*.py
          python -m py_compile custom_components/plant_helper/api/*.py
