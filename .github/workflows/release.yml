name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create Release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Extract changelog
        id: changelog
        run: |
          # Extract the changelog for this version
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # Get content between this version and the next version header
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '1d;$d')
          
          # If changelog is empty, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version $VERSION"
          fi
          
          # Save to file to preserve formatting
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          # Also output for debug
          echo "Changelog for version $VERSION:"
          cat /tmp/changelog.txt
      
      - name: Create release package
        run: |
          mkdir -p release
          cd custom_components
          zip -r ../release/plant_helper.zip plant_helper/
          cd ..
          
          # Verify the zip was created
          ls -lh release/plant_helper.zip
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Plant Helper ${{ steps.get_version.outputs.version }}
          body_path: /tmp/changelog.txt
          files: |
            release/plant_helper.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release summary
        run: |
          echo "### ✅ Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          echo "- plant_helper.zip" >> $GITHUB_STEP_SUMMARY
